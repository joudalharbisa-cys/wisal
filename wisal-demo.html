.formside{display:grid;place-items:center;padding:30px}.fcard{width:100%;max-width:420px;animation:up .5s both}.fcard h2{font-size:26px;margin:0}.fcard>.mu{margin:4px 0 18px}
.pw{position:relative}.eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);cursor:pointer;display:grid}
.spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--pr2);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.org{display:none}.menu{flex-direction:row;overflow-x:auto;order:3;width:100%}.menu button{width:auto;white-space:nowrap}.menu button.on::after{display:none}.out{margin:0 auto 0 0;width:auto}.main{padding:18px 16px}.auth-wrap{grid-template-columns:1fr}.hero{padding:28px 22px}.hc h1{font-size:32px}.feat{display:none}.tl{margin-bottom:0}}

</style>

<body>
<main id="app"></main>
<script>
const C={"جدة":[21.54,39.17],"مكة":[21.42,39.83],"المدينة":[24.47,39.61],"الرياض":[24.71,46.68],"الدمام":[26.43,50.1],"أبها":[18.22,42.5],"تبوك":[28.38,36.57]};
const ITEMS=["كراسي متحركة","أجهزة تنفس","أسرّة طبية","أجهزة قياس ضغط"];
const PR={"عاجلة":"#dc2626","متوسطة":"#d97706","عادية":"#16a34a"};
const ST=["بانتظار جهة مناسبة","بانتظار موافقة الجمعية","تمت الموافقة","قيد التسليم","تم التسليم، بانتظار تأكيد المستشفى","تم التحقق من الوصول"];
const H=[["مستشفى الملك فهد","جدة"],["مستشفى الولادة والأطفال","مكة"],["مستشفى الملك سلمان","المدينة"],["مستشفى الملك فهد الجامعي","الدمام"],["مستشفى عسير المركزي","أبها"],["مستشفى الملك خالد","تبوك"],["مستشفى الملك فيصل التخصصي","الرياض"]].map((h,i)=>({id:i,name:h[0],city:h[1]}));
const CH=[["جمعية البر بجدة","جدة",{0:50,1:6,2:12,3:30}],["جمعية الأيادي الخيرة","الرياض",{0:80,1:15,2:25,3:40}],["جمعية إنسان الصحية","المدينة",{0:20,1:4,2:10,3:15}],["جمعية البر بالشرقية","الدمام",{0:35,1:8,2:14,3:20}],["جمعية سلام الجنوب","أبها",{0:25,1:3,2:8,3:12}]].map((c,i)=>({id:i,name:c[0],city:c[1],stock:c[2]}));
const km=(a,b)=>{const[p,q]=[C[a],C[b]],r=x=>x*Math.PI/180,d=r(q[0]-p[0]),e=r(q[1]-p[1]);const k=Math.sin(d/2)**2+Math.cos(r(p[0]))*Math.cos(r(q[0]))*Math.sin(e/2)**2;return Math.round(12742*Math.asin(Math.sqrt(k)))};
/* ===== تخزين مؤقت داخل الصفحة فقط (يُمسح عند إغلاقها) ===== */
const STORE={orgs:{},requests:{}},SUBS={orgs:[],requests:[]};let _id=0;
const snap=c=>({docs:Object.entries(STORE[c]).map(([id,d])=>({id,data:()=>d}))});
const fire=c=>SUBS[c].forEach(f=>f(snap(c)));
const LDB={collection:c=>({onSnapshot(f){SUBS[c].push(f);setTimeout(()=>f(snap(c)),0)},async add(d){const id="d"+(++_id);STORE[c][id]={...d};fire(c);return{id}}}),
 doc:p=>{const[c,id]=p.split("/");return{async set(d){STORE[c][id]={...d};fire(c)},async update(d){STORE[c][id]={...STORE[c][id],...d};fire(c)}}}};
async function seed(){
 const pw="123456",O=[["h1","h","مستشفى الملك فهد","جدة","hospital1"],["h2","h","مستشفى عسير المركزي","أبها","hospital2"],["h3","h","مستشفى الملك سلمان","المدينة","hospital3"],["c1","c","جمعية البر بجدة","جدة","charity1",{0:50,1:6,2:12,3:30}],["c2","c","جمعية إنسان الصحية","المدينة","charity2",{0:20,1:4,2:10,3:15}],["c3","c","جمعية الأيادي الخيرة","الرياض","charity3",{0:80,1:15,2:25,3:40}],["a1","a","وزارة الصحة","الرياض","admin"]];
 for(const x of O){const o={role:x[1],name:x[2],city:x[3],username:x[4],ph:await sha(pw+":"+x[4])};if(x[5])o.stock=x[5];STORE.orgs[x[0]]=o}
 const t=Date.now(),R=(id,h,item,qty,pr,s,c,ago)=>{const H=STORE.orgs[h],C=c&&STORE.orgs[c];STORE.requests[id]={hid:h,hname:H.name,city:H.city,item,qty,pr,ex:[],ts:t-ago,s,cid:c||null,cname:C?C.name:"",dist:C?km(H.city,C.city):0}};
 R("q1","h1",0,40,"عاجلة",1,"c1",36e5);R("q2","h2",1,4,"عاجلة",0,null,72e5);R("q3","h3",2,10,"متوسطة",3,"c2",864e5)}
let db,uid,cur=null,mode="in",restored=false,orgs=[],reqs=[],signed=false,page="home",msg="",ready=false,err="";
const ROLE={h:"مستشفى",c:"جمعية",a:"جهة مشرفة"};
const NAV={h:[["home","الرئيسية"],["new","طلب جديد"],["my","طلباتي"]],c:[["home","الرئيسية"],["in","الطلبات الواردة"],["stock","المخزون"]],a:[["home","لوحة المتابعة"],["all","كل الطلبات"]]};
const me=()=>orgs.find(o=>o.id===cur),mine=()=>orgs.filter(o=>(o.owner||o.id)===uid);
const best=r=>orgs.filter(o=>o.role==="c"&&!(r.ex||[]).includes(o.id)&&+(o.stock||{})[r.item]>=r.qty).sort((a,b)=>km(r.city,a.city)-km(r.city,b.city))[0];
const n=f=>reqs.filter(f).length;
const $=id=>document.getElementById(id).value;
async function boot(){
 render();db=LDB;await seed();
 db.collection("orgs").onSnapshot(s=>{orgs=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()});
 db.collection("requests").onSnapshot(s=>{reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render()})}
function fill(u){document.getElementById("lu").value=u;document.getElementById("lp").value="123456"}
const sha=async t=>{if(window.crypto&&crypto.subtle)return [...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");let h=5381;for(const ch of t)h=(h*33^ch.charCodeAt(0))>>>0;return"f"+h.toString(16)};
function setMode(m){mode=m;msg="";render()}
async function doLogin(){
 const u=$("lu").trim().toLowerCase(),pw=$("lp");if(!u||!pw){msg="اكتب اسم المستخدم وكلمة المرور";return render()}
 const h=await sha(pw+":"+u),o=orgs.find(x=>x.username===u&&x.ph===h);
 if(!o){msg="اسم المستخدم أو كلمة المرور غير صحيحة";return render()}
 cur=o.id;signed=true;page="home";msg="";render()}
async function register(){
 const role=$("rr"),name=$("rn").trim(),u=$("ru").trim().toLowerCase(),pw=$("rp");
 if(!name||!u){msg="اكتب اسم الجهة واسم المستخدم";return render()}
 if(pw.length<6){msg="كلمة المرور يجب ألا تقل عن 6 أحرف";return render()}
 if(orgs.some(x=>x.username===u)){msg="اسم المستخدم مستخدم من قبل";return render()}
 const o={role,name,city:$("rc"),username:u,ph:await sha(pw+":"+u)};if(role==="c")o.stock={0:20,1:5,2:10,3:20};
 const ref=await db.collection("orgs").add(o);cur=ref.id;signed=true;page="home";msg="";render()}
function out(){signed=false;cur=null;msg="";mode="in";render()}
function go(p){page=p;msg="";render()}
async function submit(){
 const o=me(),r={hid:cur,hname:o.name,city:o.city,item:+$("fi"),qty:Math.max(1,+$("fq")||1),pr:$("fp"),ex:[],ts:Date.now(),s:0,cid:null,cname:"",dist:0};
 const c=best(r);if(c){r.cid=c.id;r.cname=c.name;r.dist=km(r.city,c.city);r.s=1}
 await db.collection("requests").add(r);page="my";msg=c?`تمت المطابقة مع ${c.name} (${r.dist} كم). بانتظار موافقتها.`:"لا توجد جمعية لديها الكمية حاليًا. سيُعاد البحث عند توفر المخزون.";render()}
const upd=(id,d)=>db.doc("requests/"+id).update(d);
async function act(id,a){
 const r=reqs.find(x=>x.id===id),o=me();msg="";

  await db.doc("orgs/"+cur).update({stock:{...o.stock,[r.item]:have-r.qty}});await upd(id,{s:2})}
 if(a==="no"){const ex=[...(r.ex||[]),cur],c=best({...r,ex});await upd(id,{ex,cid:c?c.id:null,cname:c?c.name:"",dist:c?km(r.city,c.city):0,s:c?1:0})}
 if(a==="take"){const have=+o.stock[r.item];if(have<r.qty){msg="مخزونك لا يكفي لهذا الطلب.";return render()}await db.doc("orgs/"+cur).update({stock:{...o.stock,[r.item]:have-r.qty}});await upd(id,{cid:cur,cname:o.name,dist:km(r.city,o.city),s:2,ex:r.ex||[]})}
 if(a==="go")await upd(id,{s:3});if(a==="done")await upd(id,{s:4});if(a==="ver")await upd(id,{s:5})}

function card(r,mode){
 const d=new Date(r.ts).toLocaleDateString("ar",{day:"numeric",month:"short"}),km2=mode==="o"?km(r.city,me().city):r.dist,it=`${r.qty} × ${ITEMS[r.item]}`;

 const ac=(mode==="c"&&r.s===1?A("ok","قبول")+A("no","رفض","x"):"")+(mode==="o"?A("take","قبول الطلب"):"")+(mode==="c"&&r.s===2?A("go","بدء التسليم"):"")+(mode==="c"&&r.s===3?A("done","تم التسليم"):"")+(mode==="h"&&r.s===4?A("ver","تأكيد استلام الدعم"):"");

 const ft=[["check","مطابقة ذكية","نجد أقرب جهة تملك الكمية المطلوبة"],["pin","متابعة حتى التسليم","من الموافقة حتى التحقق من وصول الدعم"],["chart","رؤية شاملة","لوحة متابعة للجهات المشرفة بالاحتياج الفعلي"]];
 return `<div class="auth-wrap"><div class="hero"><div class="hc">${LOGO}<h1>وصال</h1><p class="tl">نربط الاحتياج الصحي بمن يستطيع تلبيته، بسرعة ووضوح</p><ul class="feat">${ft.map(x=>`<li><div class="fi">${ic(x[0])}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></li>`).join("")}</ul></div><small>© وصال · منصة ربط الاحتياج الصحي</small></div>
 <div class="formside"><div class="fcard"><h2>${inn?"مرحبا ":"إنشاء حساب جديد"}</h2><p class="mu">${inn?"سجّل دخولك للمتابعة":"سجّل جهتك للانضمام إلى المنصة"}</p><div class="seg" style="margin-bottom:6px"><button class="${inn?"on":""}" onclick="setMode('in')">تسجيل الدخول</button><button class="${inn?"":"on"}" onclick="setMode('up')">إنشاء حساب</button></div>${err?`<div class="msg">${err}</div>`:!ready?`<div class="spin"></div>`:msg?`<div class="msg" style="margin-top:14px">${msg}</div>${f}`:f}</div></div></div>`}
function pageHTML(o){
